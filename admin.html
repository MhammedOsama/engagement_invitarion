<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex, nofollow" />

    <title>RSVP Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: #f8fafc;
        background:
          radial-gradient(circle at top, #312e81, transparent 45%),
          linear-gradient(135deg, #09090b, #111827);
      }

      .container {
        width: min(1100px, calc(100% - 30px));
        margin: auto;
        padding: 40px 0 70px;
      }

      .dashboard-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }

      h1 {
        margin: 0 0 8px;
      }

      .subtitle {
        margin: 0;
        color: #cbd5e1;
      }

      .refresh-btn {
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        color: white;
        background: linear-gradient(135deg, #2563eb, #8b5cf6);
        cursor: pointer;
        font-weight: 700;
      }

      .refresh-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
        margin-bottom: 25px;
      }

      .stat-card,
      .rsvp-card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(14px);
      }

      .stat-card {
        padding: 20px;
        border-radius: 20px;
      }

      .stat-card span {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
      }

      .stat-card strong {
        font-size: 30px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 17px;
      }

      .rsvp-card {
        padding: 20px;
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      }

      .rsvp-card h2 {
        margin: 0 0 12px;
        font-size: 21px;
      }

      .guest-count {
        display: inline-flex;
        padding: 7px 12px;
        margin-bottom: 14px;
        border-radius: 999px;
        color: #ddd6fe;
        background: rgba(139, 92, 246, 0.2);
      }

      .message {
        min-height: 50px;
        line-height: 1.7;
        color: #e2e8f0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .date {
        display: block;
        margin-top: 15px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #94a3b8;
        font-size: 13px;
      }

      .dashboard-message {
        grid-column: 1 / -1;
        padding: 30px;
        text-align: center;
        border-radius: 20px;
        color: #cbd5e1;
        background: rgba(255, 255, 255, 0.07);
      }

      .dashboard-message.error {
        color: #fecaca;
        background: rgba(220, 38, 38, 0.15);
      }

      @media (max-width: 850px) {
        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 600px) {
        .dashboard-head {
          align-items: stretch;
          flex-direction: column;
        }

        .stats,
        .cards {
          grid-template-columns: 1fr;
        }

        .refresh-btn {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <header class="dashboard-head">
        <div>
          <h1>RSVP Dashboard ✨</h1>
          <p class="subtitle">ردود حضور Mostafa & Menna Allah</p>
        </div>

        <button class="refresh-btn" id="refreshBtn">تحديث الردود</button>
      </header>

      <section class="stats">
        <article class="stat-card">
          <span>عدد الردود</span>
          <strong id="responsesCount">0</strong>
        </article>

        <article class="stat-card">
          <span>إجمالي الضيوف</span>
          <strong id="guestsCount">0</strong>
        </article>
      </section>

      <section class="cards" id="cards">
        <div class="dashboard-message">جاري تحميل الردود...</div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://btuqdhchqzqhuwdzhhuk.supabase.co";

      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_E9Rj1YLPU4KkdhNq6UnHqg_7xZ0tw7-";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
      );

      const cardsContainer = document.querySelector("#cards");
      const responsesCount = document.querySelector("#responsesCount");
      const guestsCount = document.querySelector("#guestsCount");
      const refreshBtn = document.querySelector("#refreshBtn");

      let loading = false;

      function escapeHtml(value) {
        const characters = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };

        return String(value).replace(
          /[&<>"']/g,
          (character) => characters[character],
        );
      }

      function formatDate(value) {
        return new Intl.DateTimeFormat("ar-EG", {
          dateStyle: "medium",
          timeStyle: "short",
          timeZone: "Africa/Cairo",
        }).format(new Date(value));
      }

      async function loadRsvps() {
        if (loading) return;

        const adminKey = decodeURIComponent(window.location.hash.slice(1));

        if (!adminKey) {
          cardsContainer.innerHTML = `
            <div class="dashboard-message error">
              رابط الإدارة ناقص المفتاح السري.
            </div>
          `;
          return;
        }

        try {
          loading = true;
          refreshBtn.disabled = true;
          refreshBtn.textContent = "جاري التحديث...";

          const { data, error } = await supabaseClient.rpc("get_rsvps", {
            admin_key: adminKey,
          });

          if (error) throw error;

          const totalGuests = data.reduce(
            (total, item) => total + Number(item.guest_count),
            0,
          );

          responsesCount.textContent = data.length;
          guestsCount.textContent = totalGuests;

          if (!data.length) {
            cardsContainer.innerHTML = `
              <div class="dashboard-message">
                لسه مفيش ردود حضور.
              </div>
            `;
            return;
          }

          cardsContainer.innerHTML = data
            .map(
              (item) => `
                <article class="rsvp-card">
                  <h2>${escapeHtml(item.guest_name)}</h2>

                  <span class="guest-count">
                    عدد الضيوف: ${Number(item.guest_count)}
                  </span>

                  <div class="message">
                    ${item.note ? escapeHtml(item.note) : "بدون رسالة"}
                  </div>

                  <time class="date">
                    ${formatDate(item.created_at)}
                  </time>
                </article>
              `,
            )
            .join("");
        } catch (error) {
          console.error("Dashboard error:", error);

          cardsContainer.innerHTML = `
            <div class="dashboard-message error">
              المفتاح غير صحيح أو حدثت مشكلة في تحميل الردود.
            </div>
          `;
        } finally {
          loading = false;
          refreshBtn.disabled = false;
          refreshBtn.textContent = "تحديث الردود";
        }
      }

      refreshBtn.addEventListener("click", loadRsvps);

      loadRsvps();

      setInterval(loadRsvps, 15000);
    </script>
  </body>
</html>
